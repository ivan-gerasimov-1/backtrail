saveExact: true
minimumReleaseAge: 2880
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

enableGlobalVirtualStore: true

catalogMode: strict
cleanupUnusedCatalogs: true

catalog:
  taze: 19.12.0
  typescript: 6.0.3

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

overrides:
  devalue@>=5.6.3 <=5.8.0: 5.8.1

