name: Site (Cloudflare)

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION_FILE: .nvmrc
  WRANGLER_VERSION: 4.91.0

  PNPM_BUILD_CMD: --filter @backtrail/site build

  WORKING_DIRECTORY: apps/site

  ARTIFACTS_DIR: apps/site/dist
  ARTIFACT_NAME: dist

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site_cloudflare.yml"
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site_cloudflare.yml"

jobs:
  build:
    runs-on: ${{ vars.RUNS_ON }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Setup pnpm
        run: |
          corepack enable pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm $PNPM_BUILD_CMD

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

  deploy:
    runs-on: ${{ vars.RUNS_ON }}
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Setup pnpm
        run: |
          corepack enable pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "op://LV48/Cloudflare Wrangler/Account ID"
          CLOUDFLARE_API_TOKEN: "op://LV48/Cloudflare Wrangler/API Token"

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKING_DIRECTORY }}
          command: deploy
